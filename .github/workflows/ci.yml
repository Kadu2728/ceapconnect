name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, format & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Postgres efêmero só para o job de CI — nunca o Neon compartilhado de
      # dev/produção. Migrations rodam do zero a cada execução, então a
      # suíte prova que a cadeia inteira de migrations é aplicável, não só a
      # mais recente.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ceap_connect_test
          POSTGRES_PASSWORD: ceap_connect_test
          POSTGRES_DB: ceap_connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceap_connect_test -d ceap_connect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ceap_connect_test:ceap_connect_test@localhost:5432/ceap_connect_test
      DATABASE_SSL: "false"
      JWT_SECRET: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: Aplicar migrations no Postgres efêmero
        run: alembic upgrade head

      - name: pytest
        run: pytest -v

  frontend:
    name: Frontend — lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: prettier --check
        run: npm run format:check

      - name: next build
        run: npm run build
