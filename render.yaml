# =============================================================================
# Render Blueprint — CEAP Connect API (backend FastAPI)
#
# Como usar:
#   1. Faça push deste repositório para o GitHub.
#   2. No Render: New + → "Blueprint" → conecte o repositório.
#   3. O Render lê este arquivo e cria o Web Service automaticamente.
#   4. Preencha as variáveis marcadas com `sync: false` (segredos) no painel.
#
# O deploy usa a imagem Docker em `backend/Dockerfile`, cujo CMD roda
# `alembic upgrade head` antes de subir o Uvicorn — as migrations são
# aplicadas a cada deploy, mantendo o schema sempre em sincronia.
# =============================================================================
services:
  - type: web
    name: ceap-connect-api
    runtime: docker
    # Contexto e Dockerfile relativos à raiz do repositório.
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    # O Render injeta $PORT; o CMD do Dockerfile já o respeita.
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # --- App ---
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: UVICORN_WORKERS
        value: "2"

      # --- Database (Neon) ---
      # Cole a connection string assíncrona do endpoint POOLED da Neon no
      # painel do Render (painel da Neon → "Pooled connection" — hostname
      # termina em "-pooler", ex.: ep-xxx-pooler.<region>.aws.neon.tech):
      #   postgresql+asyncpg://<user>:<password>@<host>-pooler.../<db>
      # (sem sslmode/channel_binding na URL — o TLS é ativado via DATABASE_SSL)
      # O endpoint direto (sem "-pooler") estoura o limite de conexões
      # simultâneas sob carga — nunca usar em produção.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"

      # --- JWT ---
      # Gerado automaticamente pelo Render (segredo forte, não versionado).
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # --- CORS ---
      # Após o deploy do frontend, defina aqui o domínio da Vercel, ex.:
      #   https://ceap-connect.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # --- Assistente IA (EPIC 11 — Google Gemini) ---
      # Sem a chave, o assistente segue funcionando, mas responde com uma
      # mensagem de "não configurado" em vez de respostas reais.
      # Obtenha em: https://aistudio.google.com/apikey
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest

      # --- Predição de evasão (EPIC 14) ---
      # Chave de serviço de `POST /internal/risk/recompute` (validada por
      # header, nunca por JWT). Gerada pelo Render: ninguém precisa escolher o
      # valor — se for necessário chamar o endpoint à mão, leia-o no painel.
      # O job in-process (APScheduler) roda independente dela.
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: RISK_RECOMPUTE_INTERVAL_MINUTES
        value: "60"

      # --- Otimizações medidas (Fase 4 — materialized view cohort_xp_standing) ---
      - key: COHORT_XP_REFRESH_INTERVAL_MINUTES
        value: "15"

      # --- Envolver o responsável (EPIC 17) ---
      # Sem RESEND_API_KEY o aviso por e-mail responde `sent=false` com uma
      # mensagem clara; o link de WhatsApp funciona 100% sem nenhuma chave.
      # Crie a chave em: https://resend.com/api-keys
      - key: RESEND_API_KEY
        sync: false
      # Domínio de teste do Resend — funciona sem verificar domínio próprio.
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: INTERVIEW_OFFSET_DAYS
        value: "21"
      - key: INTERVIEW_LOCATION
        value: Unidade CEAP — Pedreira, São Paulo/SP

      # --- PWA + push notifications (EPIC 18) ---
      # A chave PÚBLICA não é segredo: ela é servida ao navegador em
      # `GET /api/v1/push/public-key` para o dispositivo se inscrever. Fica
      # versionada aqui de propósito, para reduzir o que precisa ser colado à
      # mão. A PRIVADA nunca sai do servidor.
      #
      # ATENÇÃO: as duas formam um par — ao regenerar, troque AMBAS juntas,
      # senão as inscrições existentes param de receber push.
      - key: VAPID_PUBLIC_KEY
        value: BPiILHSU8e-QJJibKywUQEYYD9XzndW0Z4_aO5QvpDj3P1elwuGyJPZETUoHwMqC9uLnpBISbeJ0QVHNGn6Qvl8
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:contato@ceappedreira.org.br
